<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HEALTH-11 Bharati Demo</title>
<meta name="description" content="End-product demo of HEALTH-11 for Bharati Hospital, Pune (Dhankawadi), with the five research gaps built in. Made-up layout and people.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<style>
/* HEALTH-11 design tokens (PROJECT.md and docs/design/preview.html), light theme only. */
:root {
  color-scheme: light;
  --page: #F8FAFC;
  --card: #FFFFFF;
  --line: #E2E8F0;
  --pri: #7DB8E8;
  --pri-ink: #1D5F96;
  --ok: #BFE8D0;
  --ok-ink: #166534;
  --warn: #FCE9B2;
  --warn-ink: #854D0E;
  --bad: #F9C5C5;
  --bad-ink: #991B1B;
  --tagp: #D6E9F8;
  --tx: #334155;
  --tx2: #64748B;
  --ink: #1E3A5F;
  --note: #5B4A14;
  --sign: #0B7A4B;
  --hazard: #C2410C;
  --r: 12px;
  --shadow: 0 1px 2px rgba(30,58,95,0.05), 0 4px 14px rgba(30,58,95,0.05);
  --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--tx); font: 14px/1.55 var(--font); }
h1 { font-size: 22px; color: var(--ink); margin: 0 0 4px; font-weight: 700; line-height: 1.25; text-wrap: balance; }
h2 { font-size: 15px; color: var(--ink); margin: 0 0 10px; font-weight: 700; }
h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--tx2); margin: 0 0 8px; }
p { margin: 0; }
a { color: var(--ink); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pri-ink); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--tx2); }
.small { font-size: 12.5px; }

.demo-band { background: var(--warn); color: var(--note); font-size: 12.5px; padding: 6px max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: calc(100% - 30px); }
.side { background: var(--card); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--tagp); display: grid; place-items: center; flex: none; }
.brand b { color: var(--ink); display: block; line-height: 1.15; }
.brand span { font-size: 12px; color: var(--tx2); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: block; padding: 7px 10px; border-radius: 8px; color: var(--tx); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--page); }
.nav a[aria-current="page"] { background: var(--tagp); color: var(--ink); font-weight: 600; }
.nav .sep { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--tx2); padding: 10px 10px 2px; }
.who { margin-top: auto; font-size: 12.5px; color: var(--tx2); padding: 8px 6px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; }
main { padding: 22px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); min-width: 0; display: grid; gap: 16px; align-content: start; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 16px; }
.page-head .sub { color: var(--tx2); max-width: 78ch; }
footer.notice { border-top: 1px solid var(--line); background: var(--card); color: var(--tx2); font-size: 12.5px; padding: 12px max(16px, env(safe-area-inset-left, 0px)); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; }
.stat .big { font-size: 22px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat .lab { font-size: 12.5px; color: var(--tx2); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 10px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; font-weight: 500; cursor: pointer; color: var(--ink); display: inline-flex; gap: 6px; align-items: center; text-decoration: none; }
.btn:hover { border-color: var(--pri); }
.btn.primary { background: var(--pri); border-color: var(--pri); color: var(--ink); font-weight: 600; }
.btn.primary:hover { background: #69a9de; }
.btn.danger { color: var(--bad-ink); }
.btn.danger-solid { background: var(--bad); border-color: var(--bad); color: var(--bad-ink); font-weight: 600; }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: 0.5; cursor: default; }
label.f { display: grid; gap: 4px; font-size: 12.5px; font-weight: 500; color: var(--tx2); }
input[type="text"], input[type="email"], input[type="password"], input[type="number"], select, textarea { border: 1px solid var(--tx2); border-radius: 8px; background: var(--card); padding: 6px 9px; width: 100%; min-width: 0; color: var(--tx); }
textarea { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
.checks { display: grid; gap: 6px; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 13px; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--pri-ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; padding: 5px 11px; cursor: pointer; font-weight: 500; color: var(--tx2); }
.seg button[aria-pressed="true"] { background: var(--tagp); color: var(--ink); }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggles label { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px 2px 6px; cursor: pointer; background: var(--card); }
.pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok); color: var(--ok-ink); }
.pill.warn { background: var(--warn); color: var(--warn-ink); }
.pill.bad { background: var(--bad); color: var(--bad-ink); }
.pill.pri { background: var(--tagp); color: var(--ink); }
.pill.mute { background: var(--page); color: var(--tx2); border: 1px solid var(--line); }
.note { background: var(--warn); color: var(--note); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.note.info { background: var(--tagp); color: var(--ink); }
.note.ok { background: var(--ok); color: var(--ok-ink); }
.empty { color: var(--tx2); padding: 16px 0; text-align: center; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; font-weight: 600; color: var(--tx2); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
td.n, th.n { text-align: right; }
tr.sel td { background: var(--tagp); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--page); }
.tabs-in { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; }
.tabs-in button { border: 0; background: none; padding: 8px 11px 7px; font-weight: 500; color: var(--tx2); border-bottom: 2.5px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs-in button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pri-ink); }
#lvPanel .tabs-in button { padding: 8px 7px 7px; font-size: 13px; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60; border-radius: 10px; padding: 10px 14px; font-weight: 500; box-shadow: var(--shadow); max-width: min(420px, 90vw); }
.toast.ok { background: var(--ok); color: var(--ok-ink); }
.toast.bad { background: var(--bad); color: var(--bad-ink); }
.modal-wrap { position: fixed; inset: 0; background: rgba(30,58,95,0.25); display: grid; place-items: center; z-index: 70; padding: 16px; }
.modal { background: var(--card); border-radius: var(--r); padding: 18px; max-width: 440px; width: 100%; display: grid; gap: 14px; box-shadow: 0 10px 40px rgba(30,58,95,0.2); }
.gap-chip { display: inline-flex; gap: 6px; align-items: center; font-size: 11.5px; font-weight: 600; color: var(--ink); background: var(--tagp); border-radius: 6px; padding: 2px 8px; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--pri-ink); width: 0; transition: width 0.2s; }

/* Live simulation (Evac1 layout: controls | map | results) */
.live { display: grid; grid-template-columns: 250px minmax(0, 1fr) 310px; gap: 14px; align-items: start; }
.live .controls { display: grid; gap: 10px; }
.stage { padding: 0; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.stage-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.view { position: relative; height: min(74vh, 780px); min-height: 440px; background: var(--page); }
.view > .layer { position: absolute; inset: 0; }
.view canvas { display: block; }
.banner { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 2; background: var(--hazard); color: #fff; border-radius: 8px; padding: 8px 12px; font-weight: 500; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.view-tools { position: absolute; right: 10px; bottom: 10px; z-index: 2; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.legend-bar { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--tx2); }
.legend-bar span { display: inline-flex; gap: 5px; align-items: center; }
.sw { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.sw.sq { border-radius: 2px; }
.sw.bed { border-radius: 2px; width: 7px; height: 13px; }
.sw.line { width: 16px; height: 3px; border-radius: 2px; }
.sw.dash { width: 16px; height: 0; border-top: 2px dashed var(--hazard); border-radius: 0; }
.place-tip { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: #fff; border-radius: 8px; padding: 7px 10px; font-size: 12px; max-width: 270px; }
.clock { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.clock .t { font-size: 28px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--tx2); }
.kv dd { margin: 0; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 500; }
.alerts { display: grid; gap: 6px; max-height: 230px; overflow-y: auto; }
.alert { border: 1px solid var(--line); border-left: 3px solid var(--hazard); border-radius: 8px; padding: 6px 8px; font-size: 12.5px; display: grid; gap: 4px; }
.alert.confirmed { border-left-color: var(--sign); }
.alert.dismissed { border-left-color: var(--line); color: var(--tx2); }
.events { max-height: 240px; overflow-y: auto; font-size: 12px; display: grid; gap: 3px; }
.events div { display: grid; grid-template-columns: 46px 1fr; gap: 6px; }
.events .k-alarm, .events .k-harm { color: var(--hazard); }
.events .k-rescue { color: var(--sign); }
.loop { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; position: relative; padding-bottom: 18px; }
.loop span { font-size: 10.5px; font-weight: 600; text-align: center; padding: 6px 2px; border-radius: 6px; background: var(--page); color: var(--tx2); }
.loop.run span { animation: layer 1.6s ease-out both; }
.loop.run span:nth-child(2) { animation-delay: 0.25s; }
.loop.run span:nth-child(3) { animation-delay: 0.5s; }
.loop.run span:nth-child(4) { animation-delay: 0.75s; }
@keyframes layer { 0% { background: var(--page); color: var(--tx2); } 20% { background: var(--pri-ink); color: #fff; } 100% { background: var(--tagp); color: var(--ink); } }
.loop::after { content: attr(data-every); position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; color: var(--tx2); text-align: center; border-top: 1.5px solid var(--line); padding-top: 2px; }
.signs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.sign { border-radius: 6px; background: var(--sign); color: #fff; padding: 7px 9px; display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: center; min-height: 52px; }
.sign svg { width: 30px; height: 30px; }
.sign .where { font-size: 11px; opacity: 0.85; }
.sign .to { font-weight: 700; font-size: 13px; line-height: 1.15; }
.sign.nogo { background: var(--hazard); }
.sign.failed { background: #C9D1CD; color: #334155; }

/* Landing and log-in */
.landing { max-width: 1100px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-left, 0px)) 40px; display: grid; gap: 28px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.hero h1 { font-size: 34px; line-height: 1.15; }
.hero .tag { color: var(--pri-ink); font-weight: 600; margin-bottom: 8px; }
.hero p { font-size: 15.5px; margin-top: 10px; max-width: 58ch; }
.hero-art { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); height: 330px; position: relative; overflow: hidden; }
.hero-art > div { position: absolute; inset: 0; }
.auth { max-width: 460px; margin: 40px auto; padding: 0 max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.wizard-steps { display: flex; gap: 8px; flex-wrap: wrap; }
.wizard-steps span { padding: 4px 10px; border-radius: 999px; background: var(--page); border: 1px solid var(--line); font-size: 12.5px; color: var(--tx2); }
.wizard-steps span.on { background: var(--tagp); color: var(--ink); border-color: var(--pri); font-weight: 600; }
.wizard-steps span.done { background: var(--ok); color: var(--ok-ink); border-color: var(--ok); }
.chat { display: grid; gap: 10px; max-height: 520px; overflow-y: auto; padding: 4px; }
.msg { max-width: 82%; padding: 9px 12px; border-radius: 12px; font-size: 13.5px; }
.msg.me { justify-self: end; background: var(--tagp); color: var(--ink); }
.msg.ai { justify-self: start; background: var(--page); border: 1px solid var(--line); }
pre.json { background: var(--page); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 12px; overflow-x: auto; margin: 6px 0 0; }

/* Charts */
svg.chart { display: block; overflow: visible; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .axis { stroke: #AEB9C4; stroke-width: 1; }
svg.chart .tick { fill: var(--tx2); font-size: 11px; }
svg.chart .label { fill: var(--tx2); font-size: 11.5px; }
svg.chart .value { fill: var(--tx); font-size: 10.5px; }
svg.chart .whisker { stroke: var(--ink); stroke-width: 1.2; }
svg.chart .cross { stroke: var(--tx2); stroke-dasharray: 3 3; }
svg.chart .diag { stroke: #AEB9C4; stroke-dasharray: 4 4; }
svg.chart .cell { fill: var(--ink); font-size: 11px; }
svg.chart .cell.dark { fill: #fff; }
svg.chart .best { stroke: var(--ink); stroke-width: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--tx2); margin-bottom: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.band { height: 10px; opacity: 0.25; }
.chart-tip { position: fixed; z-index: 50; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: var(--shadow); }
.chart-tip .tip-h { font-weight: 600; color: var(--ink); margin-bottom: 2px; }
.chart-tip i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }

@media print {
  .side, .demo-band, .no-print, footer.notice { display: none !important; }
  .app { display: block; }
  .card { box-shadow: none; break-inside: avoid; }
}
@media (max-width: 1200px) {
  .live { grid-template-columns: minmax(0, 1fr); }
  .live .stage { order: -1; }
  .live .controls { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: column; }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .view { height: 64vh; min-height: 360px; }
}
@media (prefers-reduced-motion: reduce) { .loop.run span { animation: none; background: var(--tagp); color: var(--ink); } }
</style>
</head>
<body>
<div class="demo-band" id="demoBand">Demo for Bharati Hospital, Pune (Dhankawadi). The layout, departments, people and devices are made up: this is not the hospital's real plan or data.</div>
<div id="root"></div>
<div class="place-tip" id="placeTip" hidden></div>
<script type="module" src="./app.js"></script>
</body>
</html>
