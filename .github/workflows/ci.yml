name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python 3.11, PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: health11_test
          POSTGRES_USER: health11
          # Throwaway password for the disposable CI database only.
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U health11 -d health11_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://health11:ci_only_password@127.0.0.1:5433/health11_test
      TEST_DATABASE_URL: postgresql+psycopg://health11:ci_only_password@127.0.0.1:5433/health11_test
      JWT_SECRET_KEY: ci-only-jwt-secret-not-used-anywhere-else-0001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.lock.txt

      - name: Install exactly the locked packages (the same as the Docker image)
        run: |
          pip install --no-deps --only-binary=:all: -r requirements.lock.txt -r requirements-test.lock.txt
          pip check

      - name: Apply migrations
        run: alembic upgrade head

      - name: Migrations are reversible (downgrade to base, upgrade again)
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Models match migrations
        run: alembic check

      - name: Run tests
        run: python -m pytest -v

  frontend:
    name: Website checks (Node.js 24 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # Read only when the website handles requests; the build does not call it.
      BACKEND_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exactly the locked packages
        run: npm ci

      - name: No known vulnerabilities in what the website ships
        run: npm audit --omit=dev

      - name: Unit tests
        run: npm test

      - name: Lint (warnings fail)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end tests (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: health11_e2e
          POSTGRES_USER: health11
          # Throwaway password for the disposable CI database only.
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U health11 -d health11_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://health11:ci_only_password@127.0.0.1:5433/health11_e2e
      E2E_PYTHON: python
      JWT_SECRET_KEY: ci-only-jwt-secret-not-used-anywhere-else-0001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.lock.txt

      - name: Install exactly the locked Python packages
        run: |
          pip install --no-deps --only-binary=:all: -r requirements.lock.txt
          pip check

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exactly the locked packages
        working-directory: frontend
        run: npm ci

      - name: Install the Chromium browser for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Production build of the website
        working-directory: frontend
        run: npm run build

      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  images:
    name: Production images (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Backend image
        run: docker build -f backend/Dockerfile --target runtime -t health11-backend .

      - name: Backend test image (same packages plus pytest)
        run: docker build -f backend/Dockerfile --target test -t health11-backend-test .

      - name: Website image
        run: docker build -t health11-web frontend

      - name: Caddy configuration is valid
        run: >-
          docker run --rm -e SITE_HOST=localhost -e CADDY_TLS=internal
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Compose file is valid and refuses missing secrets
        run: |
          cp .env.production.example .env.production
          if docker compose -f compose.production.yml --env-file .env.production config > /dev/null 2>&1; then
            echo "compose accepted empty secrets"; exit 1
          fi
          sed -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-only-not-a-secret/' \
              -e 's/^JWT_SECRET_KEY=$/JWT_SECRET_KEY=ci-only-not-a-secret-0123456789abcdef/' \
              .env.production.example > .env.production
          docker compose -f compose.production.yml --env-file .env.production config > /dev/null
